name: Construir y publicar aplicaciones nativas

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validar fuentes y versión
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolver y validar versión
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' src/betplaycito/__init__.py | head -n 1)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "La versión del código no es válida: ${version}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "La etiqueta ${GITHUB_REF_NAME} no coincide con la versión ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validar código y definiciones de empaquetado
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_syntax.py
          node --check src/betplaycito/web/app.js
          bash -n scripts/build-deb.sh
          bash -n packaging/macos/make-icns.sh
          bash -n packaging/macos/build-dmg.sh
          python - <<'PY'
          import ast
          from pathlib import Path

          for filename in (
              "packaging/launcher.py",
              "packaging/BetPlaycito-Nelson.spec",
          ):
              path = Path(filename)
              ast.parse(path.read_text(encoding="utf-8"), filename=filename)
          PY
          test -f packaging/icons/betplaycito-nelson.ico
          test -f packaging/icons/betplaycito-nelson.png
          test -f packaging/windows/BetPlaycito-Nelson.iss
          test -f packaging/macos/entitlements.plist

  windows:
    name: Windows x64
    needs: validate
    runs-on: windows-2022
    env:
      APP_VERSION: ${{ needs.validate.outputs.version }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Instalar herramientas de construcción
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --requirement packaging/requirements-build.txt

      - name: Construir ejecutable portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:BETPLAYCITO_ICON = (Resolve-Path "packaging/icons/betplaycito-nelson.ico").Path
          python -m PyInstaller --noconfirm --clean `
            --distpath dist-native `
            --workpath build-native `
            packaging/BetPlaycito-Nelson.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validar ejecutable y recursos incluidos
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $portable = "dist-native/BetPlaycito-Nelson.exe"
          if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) {
            throw "PyInstaller no produjo $portable"
          }
          $listing = (& pyi-archive_viewer -l $portable 2>&1 | Out-String)
          if ($listing -notmatch "betplaycito[/\\]web[/\\]index\.html") {
            throw "El ejecutable no contiene betplaycito/web/index.html"
          }
          if ($listing -notmatch "betplaycito[/\\]web[/\\]app\.css") {
            throw "El ejecutable no contiene betplaycito/web/app.css"
          }
          if ($listing -notmatch "betplaycito[/\\]web[/\\]app\.js") {
            throw "El ejecutable no contiene betplaycito/web/app.js"
          }

      - name: Firmar ejecutable portable
        if: env.WINDOWS_CERTIFICATE_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $certificate = Join-Path $env:RUNNER_TEMP "betplaycito-authenticode.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw "No se encontró signtool.exe" }
          & $signTool sign /fd SHA256 /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            "dist-native/BetPlaycito-Nelson.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signTool verify /pa /v "dist-native/BetPlaycito-Nelson.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WINDOWS_CERTIFICATE_PATH=$certificate" >> $env:GITHUB_ENV
          "SIGNTOOL_PATH=$signTool" >> $env:GITHUB_ENV

      - name: Construir instalador con UAC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "No se encontró el compilador de Inno Setup."
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" `
            "packaging/windows/BetPlaycito-Nelson.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Firmar instalador
        if: env.WINDOWS_CERTIFICATE_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "dist-native/BetPlaycito-Nelson-$env:APP_VERSION-Windows-x64-Setup.exe"
          & $env:SIGNTOOL_PATH sign /fd SHA256 /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /f $env:WINDOWS_CERTIFICATE_PATH `
            /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:SIGNTOOL_PATH verify /pa /v $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Nombrar y validar artefactos de Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $portable = "dist-native/BetPlaycito-Nelson-$env:APP_VERSION-Windows-x64-portable.exe"
          $installer = "dist-native/BetPlaycito-Nelson-$env:APP_VERSION-Windows-x64-Setup.exe"
          Move-Item -LiteralPath "dist-native/BetPlaycito-Nelson.exe" -Destination $portable
          foreach ($path in @($portable, $installer)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Falta el artefacto esperado: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -lt 1MB) {
              throw "El artefacto parece incompleto: $path"
            }
          }

      - name: Guardar artefactos de Windows
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64
          path: |
            dist-native/BetPlaycito-Nelson-${{ env.APP_VERSION }}-Windows-x64-portable.exe
            dist-native/BetPlaycito-Nelson-${{ env.APP_VERSION }}-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      APP_VERSION: ${{ needs.validate.outputs.version }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar herramientas de construcción
        shell: bash
        run: python -m pip install --disable-pip-version-check --requirement packaging/requirements-build.txt

      - name: Crear icono de macOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-native
          bash packaging/macos/make-icns.sh \
            packaging/icons/betplaycito-nelson.png \
            build-native/betplaycito-nelson.icns

      - name: Importar certificado Developer ID
        if: env.MACOS_CERTIFICATE_BASE64 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/betplaycito-developer-id.p12"
          keychain_path="${RUNNER_TEMP}/betplaycito-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "betplaycito-developer-id.p12"
          output.write_bytes(base64.b64decode(os.environ["MACOS_CERTIFICATE_BASE64"], validate=True))
          PY
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"
          echo "BETPLAYCITO_CODESIGN_IDENTITY=${MACOS_SIGNING_IDENTITY}" >> "${GITHUB_ENV}"

      - name: Construir aplicación macOS
        shell: bash
        run: |
          set -euo pipefail
          export BETPLAYCITO_ICON="${PWD}/build-native/betplaycito-nelson.icns"
          export BETPLAYCITO_ENTITLEMENTS="${PWD}/packaging/macos/entitlements.plist"
          export PYINSTALLER_STRICT_BUNDLE_CODESIGN_ERROR=1
          python -m PyInstaller --noconfirm --clean \
            --distpath dist-native \
            --workpath build-native/pyinstaller \
            packaging/BetPlaycito-Nelson.spec

      - name: Validar bundle, arquitectura y recursos
        shell: bash
        run: |
          set -euo pipefail
          app_path="dist-native/BetPlaycito Nelson.app"
          executable="${app_path}/Contents/MacOS/BetPlaycito-Nelson"
          test -d "${app_path}"
          test -x "${executable}"
          for resource in index.html app.css app.js; do
            resource_path="$(find "${app_path}/Contents" \
              -path "*/betplaycito/web/${resource}" -print -quit)"
            if [[ -z "${resource_path}" || ! -f "${resource_path}" ]]; then
              echo "El bundle no contiene betplaycito/web/${resource}" >&2
              exit 1
            fi
          done
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app_path}/Contents/Info.plist")"
          test "${bundle_version}" = "${APP_VERSION}"
          file "${executable}" | tee build-native/macos-binary.txt
          grep -q "${{ matrix.arch }}" build-native/macos-binary.txt
          codesign --verify --deep --strict --verbose=2 "${app_path}"

      - name: Crear imagen DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="dist-native/BetPlaycito-Nelson-${APP_VERSION}-macOS-${{ matrix.arch }}.dmg"
          bash packaging/macos/build-dmg.sh \
            "dist-native/BetPlaycito Nelson.app" \
            "${dmg_path}"

      - name: Firmar imagen DMG
        if: env.MACOS_CERTIFICATE_BASE64 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="dist-native/BetPlaycito-Nelson-${APP_VERSION}-macOS-${{ matrix.arch }}.dmg"
          codesign --force --timestamp \
            --sign "${MACOS_SIGNING_IDENTITY}" \
            "${dmg_path}"
          codesign --verify --strict --verbose=2 "${dmg_path}"

      - name: Notarizar y adjuntar ticket de Apple
        if: env.MACOS_CERTIFICATE_BASE64 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' && env.MACOS_SIGNING_IDENTITY != '' && env.APPLE_API_KEY_P8_BASE64 != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          dmg_path="dist-native/BetPlaycito-Nelson-${APP_VERSION}-macOS-${{ matrix.arch }}.dmg"
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / f"AuthKey_{os.environ['APPLE_API_KEY_ID']}.p8"
          output.write_bytes(base64.b64decode(os.environ["APPLE_API_KEY_P8_BASE64"], validate=True))
          PY
          xcrun notarytool submit "${dmg_path}" \
            --key "${key_path}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" \
            --wait
          xcrun stapler staple "${dmg_path}"
          xcrun stapler validate "${dmg_path}"

      - name: Validar nombre e integridad del DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="dist-native/BetPlaycito-Nelson-${APP_VERSION}-macOS-${{ matrix.arch }}.dmg"
          test -s "${dmg_path}"
          hdiutil imageinfo "${dmg_path}" >/dev/null

      - name: Guardar artefacto de macOS
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-${{ matrix.arch }}
          path: dist-native/BetPlaycito-Nelson-${{ env.APP_VERSION }}-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14

  linux-deb:
    name: Debian y Ubuntu
    needs: validate
    runs-on: ubuntu-24.04
    env:
      APP_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar validadores de paquetes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils

      - name: Construir paquete DEB
        shell: bash
        run: bash scripts/build-deb.sh

      - name: Validar nombre y metadatos del DEB
        shell: bash
        run: |
          set -euo pipefail
          deb_path="dist/betplaycito-nelson_${APP_VERSION}_all.deb"
          test -s "${deb_path}"
          test "$(dpkg-deb --field "${deb_path}" Package)" = "betplaycito-nelson"
          test "$(dpkg-deb --field "${deb_path}" Version)" = "${APP_VERSION}"
          test "$(dpkg-deb --field "${deb_path}" Architecture)" = "all"
          mkdir -p build-native
          dpkg-deb --contents "${deb_path}" > build-native/deb-contents.txt
          grep -q 'usr/share/applications/betplaycito-nelson.desktop' build-native/deb-contents.txt
          grep -q 'opt/betplaycito-nelson/BetPlaycito-Nelson.pyz' build-native/deb-contents.txt

      - name: Guardar paquete DEB
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-deb
          path: dist/betplaycito-nelson_${{ env.APP_VERSION }}_all.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - windows
      - macos
      - linux-deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Validar conjunto de publicación y generar hashes
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "BetPlaycito-Nelson-${APP_VERSION}-Windows-x64-portable.exe"
            "BetPlaycito-Nelson-${APP_VERSION}-Windows-x64-Setup.exe"
            "BetPlaycito-Nelson-${APP_VERSION}-macOS-arm64.dmg"
            "BetPlaycito-Nelson-${APP_VERSION}-macOS-x86_64.dmg"
            "betplaycito-nelson_${APP_VERSION}_all.deb"
          )
          for filename in "${expected[@]}"; do
            test -s "release-assets/${filename}"
          done
          actual_count="$(find release-assets -maxdepth 1 -type f | wc -l)"
          test "${actual_count}" -eq "${#expected[@]}"
          (
            cd release-assets
            sha256sum "${expected[@]}" > SHA256SUMS.txt
          )

      - name: Crear o actualizar la publicación
        shell: bash
        run: |
          set -euo pipefail
          assets=(release-assets/*)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag \
              --title "BetPlaycito Nelson ${APP_VERSION}" \
              --notes "Descargas listas para Windows x64, Mac Apple Silicon, Mac Intel y Ubuntu/Debian. Acceso inicial: usuario NelsonRuiz, contraseña 1075271744. Los datos quedan guardados en el perfil local del usuario; consulte el README para instalación y respaldos." \
              --generate-notes
          fi
