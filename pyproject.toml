[project]
name = "betplaycito-nelson"
version = "1.1.0"
description = "Dashboard local y persistente de tendencias estadísticas de fútbol."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SirHegel" }]
keywords = ["futbol", "dashboard", "estadisticas", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]

[project.urls]
Repository = "https://github.com/SirHegel/betplaycito-nelson"

[project.scripts]
betplaycito = "betplaycito.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
betplaycito = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/*.png", "web/*.ico", "web/*.woff2"]
